<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hey-O! 英聽口說</title>
<meta name="description" content="用 Saddleback Kids《Hey-O! Stories of the Bible》動畫練英聽、跟讀、聽寫與單字。">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#FF6B3D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hey-O 英聽">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}</script>
</head>
<body>
<header class="topbar">
  <a href="#/" class="brand" aria-label="回首頁">
    <span class="brand-badge">Hey-O!</span>
    <span class="brand-text">英聽口說</span>
  </a>
  <div class="topbar-right">
    <span class="streak" id="streak" title="連續練習天數"></span>
    <a href="#/words" class="icon-btn" aria-label="生字本" title="生字本">
      <svg viewBox="0 0 24 24"><path d="M6 3h11a2 2 0 0 1 2 2v16l-7.5-4L4 21V5a2 2 0 0 1 2-2z"/></svg>
      <span class="count" id="wordCount"></span>
    </a>
  </div>
</header>

<main id="app"></main>

<!-- 單字卡（bottom sheet） -->
<div class="sheet-backdrop" id="sheetBackdrop" hidden></div>
<section class="sheet" id="sheet" hidden aria-live="polite"></section>

<div class="toast" id="toast" role="status" hidden></div>

<script src="https://www.youtube.com/iframe_api" async></script>
<script src="js/app.js"></script>
</body>
</html>
